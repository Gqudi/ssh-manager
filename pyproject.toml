[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ssh-manager"
dynamic = ["version"]
description = "A simple Qt SSH connection manager"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gqudi" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.11",
]

[project.scripts]
ssh-manager = "ssh_manager.__main__:main"

[tool.hatch.version]
# Single source of truth: the version lives in the package itself.
path = "src/ssh_manager/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true

[tool.hatch.build.targets.wheel]
packages = ["src/ssh_manager"]

[tool.hatch.build]
# Ship the window icon even though it is not a Python module.
artifacts = ["src/ssh_manager/assets/*.svg"]
