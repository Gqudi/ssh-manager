[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ssh-manager"
version = "0.1.0"
description = "A simple Qt SSH connection manager"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gqudi" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ssh-manager = "ssh_manager.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/ssh_manager"]
